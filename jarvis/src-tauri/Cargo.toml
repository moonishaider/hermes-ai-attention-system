[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "Jarvis native desktop client for the protected Hermes intelligence backend"
authors = ["Syed Moonis Haider"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
libc = "=0.2.189"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
