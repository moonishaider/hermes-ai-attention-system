[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-attention"
version = "0.1.0"
description = "Local intelligence, provenance, policy, and attention core for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Syed Moonis Haider"}]
dependencies = []

[project.optional-dependencies]
web = ["ddgs==9.14.4"]
documents = ["pypdf==6.10.0", "python-docx==1.2.0", "openpyxl==3.1.5", "reportlab==4.4.9", "Pillow==12.3.0", "pypdfium2==5.13.0"]

[project.scripts]
hermes-attention = "hermes_attention.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
